# Modelo para /srv/infra/proxy/rotas/breve-link.conf na VPS.
# O servidor administra este arquivo; o deploy da aplicação não o instala.
# Incluir dentro do server HTTPS do proxy compartilhado.
# Remover as reservas 404 de /breve-link antes de adicionar estes locations.
# Resolver do Docker: permite recriar o breve-link sem reiniciar o Nginx.
location = /breve-link {
    return 308 /breve-link/$is_args$args;
}
location ^~ /breve-link/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $breve_backend breve-link:3000;
    proxy_pass http://$breve_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
