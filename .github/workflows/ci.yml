name: CI e deploy

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

jobs:
    build-e-testes:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:app
            - run: npm run build
            - run: npm test -- --runInBand

    deploy:
        needs: build-e-testes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        environment: production
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4
            - name: Preparar acesso SSH
              env:
                  SSH_HOST: ${{ secrets.VPS_HOST }}
                  SSH_USER: ${{ secrets.VPS_USER }}
                  SSH_PORT: ${{ secrets.VPS_PORT }}
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
              shell: bash
              run: |
                  set -euo pipefail
                  : "${SSH_HOST:?Configure VPS_HOST}"
                  : "${SSH_USER:?Configure VPS_USER}"
                  : "${SSH_KEY:?Configure VPS_SSH_KEY}"
                  : "${SSH_KNOWN_HOSTS:?Configure VPS_KNOWN_HOSTS}"
                  umask 077
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            - name: Publicar commit aprovado na VPS
              env:
                  SSH_HOST: ${{ secrets.VPS_HOST }}
                  SSH_USER: ${{ secrets.VPS_USER }}
                  SSH_PORT: ${{ secrets.VPS_PORT }}
              shell: bash
              run: |
                  set -euo pipefail
                  ssh -T -i ~/.ssh/deploy_key \
                    -o BatchMode=yes -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
                    -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                    -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
                    "bash -s -- '$GITHUB_SHA'" < .github/scripts/deploy.sh
            - name: Remover chave temporária
              if: always()
              shell: bash
              run: rm -f ~/.ssh/deploy_key
